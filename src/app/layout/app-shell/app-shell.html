<div class="shell" [class.shell--collapsed]="sidebarCollapsed()">
  <aside class="sidebar" id="workspace-sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="FlowOps — Visão geral">
      <span class="brand__mark"><img src="/assets/flowops-logo.png" alt="" /></span>
      <span class="brand__name">Flow<span>Ops</span></span>
    </a>

    <nav class="navigation" aria-label="Navegação principal">
      <span class="navigation__label">Workspace</span>
      @for (item of navigationItems(); track item.route) {
        <a
          class="navigation__item"
          [routerLink]="item.route"
          [attr.aria-label]="item.label"
          [attr.title]="item.label"
          routerLinkActive="navigation__item--active"
          ariaCurrentWhenActive="page"
        >
          <app-icon [name]="item.icon" [size]="19" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button
        class="sidebar-toggle"
        type="button"
        aria-controls="workspace-sidebar"
        [attr.aria-expanded]="!sidebarCollapsed()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expandir menu lateral' : 'Recolher menu lateral'"
        [attr.title]="sidebarCollapsed() ? 'Expandir menu lateral' : 'Recolher menu lateral'"
        (click)="toggleSidebar()"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 4v16" />
          <path
            [attr.d]="
              sidebarCollapsed() ? 'm10 8 4 4-4 4m5-8 4 4-4 4' : 'm14 8-4 4 4 4m5-8-4 4 4 4'
            "
          />
        </svg>
        <span>Recolher menu</span>
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar__context">
        <span>Workspace</span>
        <strong>Visão operacional</strong>
      </div>
      <div class="topbar__profile">
        <app-theme-toggle />
        <span class="profile-avatar">{{ auth.initials() }}</span>
        <span class="profile-copy"
          ><strong>{{ auth.user()?.nomeCompleto }}</strong
          ><small>{{ auth.user()?.email }}</small></span
        >
        <button class="logout-button" type="button" (click)="auth.logout()">Encerrar</button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
