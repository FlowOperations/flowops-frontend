<button
  #trigger
  class="filter-trigger"
  type="button"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="label() + (selected() ? ': ' + selected()?.label : '')"
  [disabled]="!options().length"
  (click)="open.update((value) => !value)"
>
  <span class="filter-label">{{ label() }}</span>
  @if (selected(); as option) {
    <span class="filter-value">{{ option.label }}</span>
  }
  <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
    <path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" />
  </svg>
</button>

@if (open()) {
  <div
    class="filter-popup"
    [class.filter-popup--end]="alignEnd()"
    [class.filter-popup--up]="dropUp()"
    role="group"
    [attr.aria-label]="label()"
  >
    @for (option of options(); track option.value) {
      <button type="button" [attr.aria-pressed]="option.value === value()" (click)="choose(option)">
        <span class="filter-check" aria-hidden="true">{{
          option.value === value() ? '✓' : ''
        }}</span>
        {{ option.label }}
      </button>
    }
  </div>
}
